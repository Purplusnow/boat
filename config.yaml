# 사이트 설정.
#
# 광고·애널리틱스·검색엔진 확인 태그는 두지 않는다. 필요해지면 base.html 에
# 추가하되, 그 전까지 코드에 남겨 두면 관리 비용만 늘고 의도치 않게 켜질 수 있다.
site:
  name: "경정 분석"
  tagline: "미사리 경정 · 승률 예측과 적중률 검증"
  # 절대 URL. canonical 과 dist/CNAME 이 여기서 나온다.
  url: "https://boat.koreanblog.xyz"
  # **배포 기준 경로.** 커스텀 도메인은 루트에 놓이므로 비워 둔다.
  # 프로젝트 페이지(user.github.io/<저장소>/)로 옮길 일이 생기면 그때만
  # BOATAI_BASE=/<저장소명> 으로 빌드하면 된다 — 링크가 전부 그 경로로 나간다.
  base_path: ""
  locale: "ko_KR"
  description: "미사리 경정 출주표와 선수·모터·코스 기록을 머신러닝 모델로 학습해 경주별 승률을 산출합니다. 예상은 발주 전에 확정 저장하며, 실제 결과·배당과 대조한 적중률과 회수율을 공개합니다."

# 애드센스. client 가 비어 있으면 로더 스크립트도, 광고 자리도 나가지 않는다.
#
# slot_* 은 AdSense 콘솔에서 **이 사이트용 광고 단위**를 만들어 받은 번호다.
# 비워 두면 수동 광고 자리는 렌더링되지 않고, 로더만 실린다 — 콘솔에서 자동
# 광고를 켜 두었다면 그것만으로 게재된다.
#
# 새 사이트는 AdSense 콘솔에 도메인을 추가하고 승인을 받아야 게재가 시작된다.
adsense:
  client: "ca-pub-4640178123605595"
  slot_top: ""
  slot_in_article: ""
  slot_bottom: ""

build:
  # 상세 페이지를 만들 과거 경주 수. 워크포워드 기록이 1만 6천 경주라 전부
  # 구우면 파일이 수만 개가 된다 — 손으로 훑어볼 수 있는 만큼만 만든다.
  past_races: 400
  # 목록에 노출할 다가올 경주 최대 수
  upcoming_limit: 60
  # 결과 아카이브에 실을 경주 수
  results_limit: 300
  # 구간별 집계를 내보낼 최소 표본. 이보다 얕으면 백분율이 잡음이다.
  min_sample: 30
