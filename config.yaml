# 사이트 설정.
#
# 광고·애널리틱스·검색엔진 확인 태그는 두지 않는다. 필요해지면 base.html 에
# 추가하되, 그 전까지 코드에 남겨 두면 관리 비용만 늘고 의도치 않게 켜질 수 있다.
site:
  name: "경정 분석"
  tagline: "미사리 경정 · 승률 예측과 적중률 검증"
  # 절대 URL. 채우면 canonical 이 붙는다. (예: https://user.github.io)
  url: ""
  # **배포 기준 경로.** GitHub Pages 프로젝트 페이지는 user.github.io/<저장소>/
  # 아래에 놓이므로, 모든 내부 링크가 이 경로로 시작해야 한다. 비워 두면
  # 루트 배포(커스텀 도메인·사용자 페이지)로 동작한다.
  #
  # 로컬에서 `python -m http.server -d dist` 로 열 때는 루트이므로 비워 두고,
  # 배포 빌드에서만 채운다:  BOATAI_BASE=/boatai python -m boatai.site
  base_path: ""
  locale: "ko_KR"
  description: "미사리 경정 출주표와 선수·모터·코스 기록을 분석해 경주별 승률을 산출합니다. 예상은 발주 전에 확정 저장하며, 실제 결과·배당과 대조한 적중률과 회수율을 공개합니다."

build:
  # 상세 페이지를 만들 과거 경주 수. 워크포워드 기록이 1만 6천 경주라 전부
  # 구우면 파일이 수만 개가 된다 — 손으로 훑어볼 수 있는 만큼만 만든다.
  past_races: 400
  # 목록에 노출할 다가올 경주 최대 수
  upcoming_limit: 60
  # 결과 아카이브에 실을 경주 수
  results_limit: 300
  # 구간별 집계를 내보낼 최소 표본. 이보다 얕으면 백분율이 잡음이다.
  min_sample: 30
