# 개최일에 맞춰 자료를 받아 사이트를 다시 굽고 GitHub Pages 로 올린다.
#
# 경정은 수·목에 시행하고 발주는 11:40~17:57 KST 다.
#
# **결과는 하루 뒤에 공개된다.** 실측: 8/13(목) 21:18 에도 그날 착순은 API 에
# 순위 필드조차 없었고, 8/12(수) 것은 이미 다 들어와 있었다. 즉 경주가 끝난
# 당일 밤에 받아 봐야 아무것도 없다.
#
# ── 왜 하루 여섯 번인가 ────────────────────────────────────────────────
#
# 사람이 지켜보지 않아도 굴러가야 한다. 그런데 이 파이프라인은 **성공했다고
# 말하면서 실패한 적이 있다.** 실제로 겪은 것들이다.
#
# * 러너에서 포털로 나가는 연결이 세 번 다 끊겼는데 '기존 자료로 진행' 하며
#   초록불로 끝났다. 그날 개최일 출주표가 통째로 안 들어와 예상이 비었다.
# * 09:00 예약 실행이 아예 뜨지 않은 날이 있었다. GitHub 예약은 보장이 아니라
#   여유가 있을 때 도는 것이고, 몇 분에서 십수 분 늦거나 건너뛴다.
#
# 한 번의 실행에 기대면 이 두 가지에 그대로 당한다. 그래서 **출주표가 올라올
# 만한 시간대에 촘촘히, 발주 직전에 한 번 더** 돈다. 이미 예상이 있는 경주는
# 건드리지 않으므로 여러 번 돌아도 덮어쓰지 않는다.
#
#   07:00 · 09:00 · 10:00 KST — 당일 아침에 올라오는 출주표를 잡는다
#   11:00 KST                 — 첫 발주(11:40) 전 마지막 기회
#   22:30 · 01:00 KST         — 다음 개최일 출주표와 전날 결과를 잡는다
#
# **크론은 UTC 다.** KST 는 +9 이므로 00:00 UTC = 09:00 KST.
name: 사이트 배포

on:
  schedule:
    - cron: "0 22 * * *"      # 07:00 KST
    - cron: "0 0 * * *"       # 09:00 KST
    - cron: "0 1 * * *"       # 10:00 KST
    - cron: "0 2 * * *"       # 11:00 KST — 첫 발주 40분 전
    - cron: "30 13 * * *"     # 22:30 KST
    - cron: "0 16 * * *"      # 01:00 KST
  workflow_dispatch:           # 손으로도 돌릴 수 있게

permissions:
  # 확정 기록(records/frozen.json)을 저장소에 되돌려 쓰기 위해 write 가 필요하다.
  contents: write
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 앞 실행이 끝나기 전에 다음이 끼어들면 반쯤 만든
# 사이트가 올라갈 수 있다. 하루 여섯 번으로 늘렸으니 겹칠 일이 더 잦은데,
# cancel-in-progress 를 켜면 확정 저장 중인 실행이 잘릴 수 있어 줄을 세운다.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHONPATH: src
  KBOAT_SERVICE_KEY: ${{ secrets.KBOAT_SERVICE_KEY }}
  # 커스텀 도메인(boat.koreanblog.xyz)은 루트에 놓이므로 기준 경로가 없다.
  # 프로젝트 페이지로 옮기면 여기를 /<저장소명> 으로 채운다.
  BOATAI_BASE: ""

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      health: ${{ steps.health.outputs.status }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # 수집 자료(약 140MB)는 저장소에 담지 않고 캐시로 나른다.
      #
      # **복원과 저장을 나눈 이유**: 통짜 actions/cache 는 잡이 실패하면 저장을
      # 건너뛴다. 첫 실행에서 24년치를 18분에 걸쳐 받아 놓고 뒤 단계가 깨지는
      # 바람에 그 수집이 통째로 날아갔다. 수집이 끝나자마자 저장해 두면 이후
      # 어디서 깨지든 다음 실행이 그 지점부터 이어간다.
      - name: 수집 자료 복원
        uses: actions/cache/restore@v4
        with:
          path: data
          key: boatai-db-${{ github.run_id }}
          restore-keys: boatai-db-

      # 캐시가 없으면(첫 실행·만료) 처음부터 만든다. 24년치 백필이 700회 남짓
      # 호출이라 개발계정 일일 한도(1만) 안에 들어간다. 시간은 걸리지만 드물다.
      #
      # 포털이 잠시 죽어도 배포까지 죽이지 않는다. 통신 한 번 실패했다고
      # 사이트를 아예 안 굽는 것보다, 기존 자료로 굽고 경고를 남기는 편이 낫다.
      # **다만 그 관대함이 조용한 결손이 되지 않도록** 마지막에 자체 점검이
      # 결손을 세고 빨간불을 낸다.
      #
      # 재시도 간격을 벌린 이유: 해외 러너에서 끊길 때는 연달아 끊긴다. 30초
      # 간격으로 세 번은 사실상 한 번과 같았다(실측: 세 번 모두 타임아웃).
      # 물러서며 기다리면 같은 실행 안에서 살아나는 쪽에 걸 수 있다.
      #
      # DB 가 아예 없을 때의 최초 수집은 관대하게 넘기지 않는다. 그때 실패하면
      # 예상도 검증도 없는 빈 사이트가 올라간다.
      - name: 자료 수집
        run: |
          collect () {
            local wait=20
            for try in 1 2 3 4 5; do
              python -m boatai.kboat.collect daily && return 0
              echo "수집 $try 회차 실패 — ${wait}초 뒤 다시 시도"
              sleep $wait
              wait=$((wait * 2))
            done
            return 1
          }
          if [ -f data/boatai.sqlite ]; then
            collect \
              || echo "::warning::자료 수집 실패 — 기존 자료로 진행합니다"
          else
            echo "캐시 없음 — 처음부터 수집합니다"
            python -m boatai.kboat.collect backfill
            python -m boatai.predict backfill
          fi
          python -m boatai.kboat.collect prune || true

      # 확정 기록을 DB 로 되돌린다. 캐시가 만료되면 DB 는 새로 만들어지는데,
      # **발주 전에 확정 저장한 예상은 그때 사라지면 안 된다** — 적중률이
      # 사후 조작이 아니라는 근거가 그것뿐이다. 저장소의 파일이 원본이다.
      - name: 확정 기록 복원
        run: python -m boatai.predict import

      # 비싼 단계가 끝났으니 곧바로 저장한다. 뒤에서 실패해도 남는다.
      - name: 수집 자료 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: boatai-db-${{ github.run_id }}

      # 발주가 지나지 않은 경주에만 예상을 만든다. 이미 저장된 예상은 건드리지
      # 않으므로 하루 여섯 번 돌려도 덮어쓰지 않는다.
      - name: 예상 생성
        run: |
          python -m boatai.predict upcoming \
            || echo "::warning::예상 생성 실패 — 기존 예상으로 진행합니다"

      # 발주 전에 예상을 못 만든 경주(자동 실행이 늦었거나 사이트가 없던 날)에
      # 사후 예상을 붙여 기록의 구멍을 메운다. **학습 종료일 이후 경주만**
      # 대상이고, v1 과 다른 버전으로 저장되어 적중률에는 들어가지 않는다.
      - name: 사후 예상 (구멍 메우기)
        run: |
          python -m boatai.predict late \
            || echo "::warning::사후 예상 생성 실패 — 넘어갑니다"

      # 자료 결손은 실패로 만들지 않는다 — 배당은 원래 늦게 들어오므로 저녁
      # 실행에서도 일부는 비어 있다. 다만 로그에는 남겨 눈에 띄게 한다.
      - name: 자료 점검
        run: python -m boatai.audit --days 30 || true

      # 새로 확정한 예상을 저장소에 남긴다. 캐시는 임시지만 저장소는 남는다.
      #
      # **푸시 실패로 배포를 죽이지 않는다.** 하루 여섯 번 돌고 손으로도 밀다
      # 보면 그 사이에 다른 커밋이 올라와 있을 수 있다. 받아서 다시 얹고
      # 시도하되, 그래도 안 되면 경고만 남긴다 — 확정 기록은 캐시에도 있고
      # 다음 실행이 다시 내보낸다.
      - name: 확정 기록 저장
        run: |
          python -m boatai.predict export
          if git diff --quiet records/; then
            echo "새로 확정된 예상 없음"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add records/
          git commit -m "확정 기록 갱신 ($(TZ=Asia/Seoul date +%Y-%m-%d\ %H:%M) KST)"
          for try in 1 2 3; do
            git push && exit 0
            echo "푸시 $try 회차 실패 — 원격을 받아 다시 얹는다"
            git pull --rebase --autostash origin main || true
          done
          echo "::warning::확정 기록 푸시 실패 — 다음 실행이 다시 시도합니다"

      # **여기서 조용한 실패를 잡는다.**
      #
      # 배포는 막지 않는다 — 결손이 있어도 나머지는 최신으로 올리는 편이 낫다.
      # 대신 결과를 뒤 잡으로 넘겨 빨간불을 내게 한다. 실패한 실행은 알림이
      # 오므로, 사람이 봐야 할 때만 사람을 부른다.
      - name: 자체 점검
        id: health
        continue-on-error: true
        run: |
          if python -m boatai.health --strict; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
          fi
          python -m boatai.health >> "$GITHUB_STEP_SUMMARY" || true

      - name: 사이트 빌드
        run: python -m boatai.site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # 배포가 끝난 뒤에 빨간불을 낸다. 순서가 중요하다 — 점검을 build 안에서
  # 실패시키면 deploy 가 통째로 건너뛰어, 결손 하나 때문에 멀쩡한 갱신까지
  # 못 올라간다.
  health:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: 결손 확인
        run: |
          if [ "${{ needs.build.outputs.health }}" != "ok" ]; then
            echo "::error title=자체 점검 실패::예상 또는 결과에 구멍이 있습니다. build 잡의 '자체 점검' 로그를 보세요."
            exit 1
          fi
          echo "밀린 일 없음"
